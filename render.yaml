services:
  - type: web
    name: easy-etf-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://giuseppesiragusa.github.io
      - key: CACHE_SECONDS
        value: "1800"
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
